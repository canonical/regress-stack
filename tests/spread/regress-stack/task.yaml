summary: regress-stack

environment:
  MANILA_BACKEND: $(HOST:echo ${MANILA_BACKEND:-lvm})
  MANILA_CEPHFS_NFS_MODE: $(HOST:echo ${MANILA_CEPHFS_NFS_MODE:-cluster})
  FEATURE_ENABLE_CEPH: $(HOST:echo ${FEATURE_ENABLE_CEPH:-false})
  TEST_INCLUDE_REGEXES: $(HOST:echo ${TEST_INCLUDE_REGEXES:-""})
  TEST_EXCLUDE_REGEXES: $(HOST:echo ${TEST_EXCLUDE_REGEXES:-""})
  TEMPEST_SOURCE: $(HOST:echo ${TEMPEST_SOURCE:-apt})
  TEMPEST_CHANNEL: $(HOST:echo ${TEMPEST_CHANNEL:-""})

prepare: |
  set -euxo pipefail
  # Workaround for intermittent archive/PPA HTTP 503 responses during downloads.
  # Retrying lets transient service failures recover while preserving the
  # selected package source. Exhausted retries still fail preparation.
  echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-regress-stack-retries
  # Workaround for Jammy daily VMs booting a KVM kernel without nfsd.
  # The virtual kernel package provides a generic kernel with NFS server
  # support. Prefer that kernel and reboot before configuring Manila LVM.
  if [ "$(lsb_release -sc)" = jammy ] && [ "${MANILA_BACKEND:-lvm}" = lvm ] && ! modprobe nfsd; then
    if [ "${SPREAD_REBOOT:-0}" != 0 ]; then
      echo "The Jammy test VM still cannot load nfsd after reboot" >&2
      exit 1
    fi
    apt-get update
    apt-get install -y --no-install-recommends linux-image-virtual
    echo 'GRUB_FLAVOUR_ORDER="generic"' > /etc/default/grub.d/99-regress-stack-nfs.cfg
    update-grub
    REBOOT
  fi
  if ! grep -q 127.0.1.1 /etc/hosts; then
    echo "127.0.1.1 $(hostname)" >> /etc/hosts
  fi
  if [ "${APT_ENABLE_PROPOSED:-false}" != false ]; then
    cat <<EOF > /etc/apt/preferences.d/proposed-updates
  Package: *
  Pin: release a=*-proposed
  Pin-Priority: 500
  EOF
    codename=$(lsb_release -sc)
    # noble is the first release that introduces deb822 format for sources.list
    # https://discourse.ubuntu.com/t/spec-apt-deb822-sources-by-default/29333
    if [[ "$codename" < "noble" ]]; then
      echo \
        "deb http://archive.ubuntu.com/ubuntu " \
        "${codename}-proposed main restricted" \
        >> /etc/apt/sources.list
    else
      sed -ie "/^Suites:.*updates/ s/$/ ${codename}-proposed/" \
        /etc/apt/sources.list.d/ubuntu.sources
    fi
  fi
  if [ "${APT_ENABLE_PPA:-false}" != false ]; then
    ppa_priority=${APT_PPA_PRIORITY:-600}
    if ! [[ "$ppa_priority" =~ ^-?[0-9]+$ ]]; then
      echo "APT_PPA_PRIORITY must be an integer: $ppa_priority" >&2
      exit 1
    fi
    # Workaround for Launchpad API HTTP 503 responses in add-apt-repository.
    # Acquire::Retries covers apt downloads, so retry repository discovery here.
    for attempt in 1 2 3; do
      if add-apt-repository -y "$APT_ENABLE_PPA"; then
        break
      fi
      if [ "$attempt" = 3 ]; then
        exit 1
      fi
      sleep 5
    done
    # Launchpad omits the archive name from the origin for the default "ppa".
    ppa_slug=${APT_ENABLE_PPA#ppa:}
    ppa_slug=${ppa_slug%/ppa}
    ppa_slug=${ppa_slug//\//-}
    cat <<EOF > "/etc/apt/preferences.d/pin-${ppa_slug}"
  Package: *
  Pin: release o=LP-PPA-${ppa_slug}
  Pin-Priority: ${ppa_priority}
  EOF
    # Move the image's preinstalled packages to their PPA versions. Without
    # this the job never runs them, and apt silently drops recommends that
    # need them, such as qemu's spice module through libx11-xcb1.
    DEBIAN_FRONTEND=noninteractive apt-get -y \
      -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
      upgrade
  fi
  PACKAGES="
    build-essential \
    crudini \
    libapt-pkg-dev \
    python3-all-dev \
    python3-apt \
    python3-networkx \
    python3-openstackclient"
  if [ "${FEATURE_ENABLE_CEPH:-false}" != false ]; then
    PACKAGES+="
      ceph-mgr \
      ceph-mon \
      ceph-osd \
      ceph-volume"
  fi
  if [ "${TEMPEST_SOURCE:-apt}" = apt ]; then
    PACKAGES+="
      barbican-tempest-plugin \
      heat-tempest-plugin \
      python3-tempestconf \
      tempest"
  elif [ "${TEMPEST_SOURCE:-apt}" = snap ]; then
    PACKAGES+="
      python3-stestr"
    snap install ${TEMPEST_CHANNEL:+--channel $TEMPEST_CHANNEL} tempest

    # Apparmor will not let us mess with files not owned by us, even when we
    # are root.
    chown -R $LOGNAME:$LOGNAME $SPREAD_PATH
  fi
  apt-get update
  apt-get -y install $PACKAGES

  # Install regress-stack dependencies
  apt-get install -yq python3-pyroute2

  # Install packages declared by all modules.
  pushd $SPREAD_PATH/src
  if [ "${TEMPEST_SOURCE:-apt}" = snap ]; then
    REGRESS_PACKAGES=$(python3 -m regress_stack packages --no-tempest)
  else
    REGRESS_PACKAGES=$(python3 -m regress_stack packages)
  fi
  # When rabbitmq-server is installed as part of this large batch, the
  # systemd-sysusers trigger that creates the `rabbitmq` user can fire
  # after rabbitmq-server's postinst tries to start the service. With
  # the user missing, systemd refuses to launch the unit (Main PID
  # exits with status=217/USER); Restart=on-failure then retries until
  # the start-limit burst is hit ("Start request repeated too quickly")
  # and the unit ends up failed.
  # Recover both cases by entering the branch whenever apt failed or
  # the unit is not active, then running `dpkg --configure -a` (which
  # is a no-op when nothing is half-configured) plus a restart.
  # apt-get -f install is the safety net.
  set +e
  apt-get -y install $REGRESS_PACKAGES
  apt_status=$?
  set -e
  if [ $apt_status -ne 0 ] || ! systemctl is-active --quiet rabbitmq-server; then
    systemctl status --no-pager rabbitmq-server || true
    journalctl -u rabbitmq-server --no-pager -n 200 || true
    systemctl reset-failed rabbitmq-server || true
    dpkg --configure -a
    systemctl restart rabbitmq-server
  fi
  apt-get -f install
  popd

  # Workaround for uutils dd failing direct reads from LVM snapshots with EINVAL.
  # GNU dd completes the same copy, preserving share-from-snapshot coverage.
  # Limit the command override to the disposable Resolute LVM test VM.
  # https://bugs.launchpad.net/ubuntu/+source/rust-coreutils/+bug/2168495
  if [ "$(lsb_release -sc)" = resolute ] && [ "$MANILA_BACKEND" = lvm ] && dd --version | grep -q uutils; then
    apt-get install -y gnu-coreutils
    ln -sfn /usr/bin/gnudd /usr/local/bin/dd
  fi

  # Workaround for Resolute Ganesha SIGSEGV during CephFS AddExport.
  # The affected Ubuntu Ceph patch logs through a null global context.
  # Preload its initializer for the known affected library versions. Remove
  # the service override when the installed package version changes.
  # https://bugs.launchpad.net/ubuntu/+source/ceph/+bug/2157583
  if [ "$(lsb_release -sc)" = resolute ] && [ "$MANILA_BACKEND" = cephfs-nfs ] && [ "$MANILA_CEPHFS_NFS_MODE" = standalone ]; then
    cephfs_version=$(dpkg-query -W -f='${Version}' libcephfs2)
    # Include only the confirmed affected revisions, not older unverified builds.
    if dpkg --compare-versions "$cephfs_version" ge 20.2.0-0ubuntu2 && \
       dpkg --compare-versions "$cephfs_version" le 20.2.0-0ubuntu2.1; then
      install -d /usr/local/lib/regress-stack /etc/systemd/system/nfs-ganesha.service.d
      cc -Wall -Wextra -Werror -shared -fPIC "$SPREAD_PATH/files/ceph-client-context.c" \
        -o /usr/local/lib/regress-stack/ceph-client-context.so -ldl
      cat <<EOF > /etc/systemd/system/nfs-ganesha.service.d/regress-stack-context.conf
  [Service]
  Environment=LD_PRELOAD=/usr/local/lib/regress-stack/ceph-client-context.so
  EOF
    else
      rm -f /etc/systemd/system/nfs-ganesha.service.d/regress-stack-context.conf
    fi
    systemctl daemon-reload
  fi

  # Workaround for Noble's old Manila plugin calling assertDictContainsSubset,
  # which Python 3.12 removed. Apply the upstream assertion replacement in the
  # apt test VM so metadata filtering coverage stays enabled.
  # https://opendev.org/openstack/manila-tempest-plugin/commit/c1f3f37990840be797927c826fc638a661ebb5f6
  if [ "$(lsb_release -sc)" = noble ] && [ "${TEMPEST_SOURCE:-apt}" = apt ]; then
    python3 "$SPREAD_PATH/files/manila-tempest-compat.py"
  fi

  output=$(realpath ./prepare-output.txt)

  pushd $SPREAD_PATH/src
  python3 -m regress_stack plan |& tee -a $output
  python3 -m regress_stack setup |& tee -a $output
  popd

execute: |
  set -euxo pipefail
  output=$(realpath ./execute-output.txt)
  echo "Proposed packages:" | tee -a $output
  apt list --installed | awk '/proposed/' | tee -a $output
  echo "PPA packages:" | tee -a $output
  apt list '?narrow(?installed,?origin(LP-PPA.*))' | tee -a $output

  pushd $SPREAD_PATH/src
  python3 -m regress_stack test --concurrency auto --retry-failed 3 |& tee -a $output
  popd

artifacts:
  - prepare-output.txt
  - execute-output.txt
